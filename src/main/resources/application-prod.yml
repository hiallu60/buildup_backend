spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    hikari:
      maximum-pool-size: ${BUILDUP_DB_POOL_SIZE:10}
      minimum-idle: ${BUILDUP_DB_MIN_IDLE:2}
      connection-timeout: 30000

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: native
