spring:
  application:
    name: buildup

  datasource:
    url: ${BUILDUP_DB_URL:jdbc:mysql://localhost:3306/buildup_local?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul}
    username: ${BUILDUP_DB_USERNAME:buildup_app}
    password: ${BUILDUP_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${BUILDUP_DB_POOL_SIZE:5}
      minimum-idle: ${BUILDUP_DB_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: false

    show-sql: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: ${BUILDUP_S3_MAX_FILE_SIZE:20MB}
      max-request-size: ${BUILDUP_S3_MAX_REQUEST_SIZE:21MB}

server:
  port: ${BUILDUP_SERVER_PORT:8080}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    connection-check-enabled: ${BUILDUP_S3_CONNECTION_CHECK_ENABLED:false}
    max-photo-size-bytes: ${BUILDUP_S3_MAX_PHOTO_SIZE_BYTES:10485760}
    max-file-size-bytes: ${BUILDUP_S3_MAX_FILE_SIZE_BYTES:20971520}

security:
  jwt:
    secret: ${BUILDUP_JWT_SECRET}
    issuer: buildup-api
    access-token-ttl: 15m
    refresh-token-ttl: 14d

  cors:
    allowed-origins: ${BUILDUP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
